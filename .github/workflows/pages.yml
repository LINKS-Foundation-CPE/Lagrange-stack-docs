# Build and deploy the documentation to GitHub Pages.
#
# Inert on GitLab — kept on every branch so that the `public` branch stays a
# strict cherry-picked subset of `main` (see docs/development/releases.md).
#
# One-time setup on the GitHub repository, after it is created:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# No secrets or tokens are needed; the workflow uses the built-in OIDC deploy.
#
# If the site is served from a subpath (github.io/<repo>/ rather than a custom
# domain), also set `site_url` in mkdocs.yml to the published URL so that the
# canonical links and sitemap are right.

name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; cancel a superseded in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # No --no-cache-dir: setup-python caches ~/.cache/pip, and fails the job
        # in its post step when that directory was never created.
        run: pip install -r requirements.txt

      # --strict fails on broken internal links and pages missing from the nav.
      - name: Build
        run: mkdocs build --strict --site-dir site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
